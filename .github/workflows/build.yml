name: build

# 为什么用 CI 而不是本地脚本一次跑完所有平台：
# **PyInstaller 不能交叉编译** —— 它把「当前运行的解释器 + 依赖」一起打进去，
# 所以 Windows 产物只能在 Windows 上构建，Intel Mac 产物只能在 Intel 上构建。
# CI 提供各平台的原生 runner，用一个矩阵并行跑，效果等价于"一条命令出全部"。
#
# 本地想单独打包某个平台，用 packaging/build.py。

on:
  # 推 tag 时构建并发布（例如 v0.1.0）
  push:
    tags: ["v*"]
  # 也可以手动触发，用来验证打包是否正常
  workflow_dispatch:

permissions:
  contents: write        # 发布 Release 需要

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其它平台 —— 打包问题常常是平台特有的
      fail-fast: false
      matrix:
        include:
          # ---- macOS ----
          # macos-13 是 Intel runner，用来出 x86_64 产物。
          # 这是本地 Apple Silicon 做不到的：必须 x86_64 解释器 + x86_64 wheel。
          - os: macos-13
            label: macOS x64 (Intel)
          # macos-14/15 是 Apple Silicon，出 arm64 产物
          - os: macos-14
            label: macOS arm64 (Apple Silicon)
          # ---- Windows ----
          # windows-latest 是 x64 runner。它的产物在 64 位 Windows、
          # 以及 Windows on ARM（通过模拟）上都能跑。
          - os: windows-latest
            label: Windows x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 选 3.12 而不是 3.13：opencv / zxing-cpp 在 3.12 上的
          # 预编译 wheel 覆盖最全，能少踩编译源码的坑。
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: 跑测试
        run: python -m pytest -q

      - name: 打包
        run: python packaging/build.py --clean

      # 产物名已由 build.py 按平台架构生成（例如 endfield-scanner-macos-arm64）
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-package
          path: dist/*
          # 保留 14 天足够验证；正式发布走下面的 Release
          retention-days: 14

  release:
    # 只在推 tag 时发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
